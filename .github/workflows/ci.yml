name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: ${{ vars.DEBUG || 'False' }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS || '127.0.0.1,localhost' }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || '' }}
      CORS_ALLOW_METHODS: ${{ vars.CORS_ALLOW_METHODS || 'DELETE,GET,OPTIONS,PATCH,POST,PUT' }}
      TYPE_DATABASE: ${{ vars.TYPE_DATABASE || 'SQLITE' }}
      DATABASE_ENGINE: ${{ vars.DATABASE_ENGINE || 'django.db.backends.sqlite3' }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME || 'db.sqlite3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate temporary test secret
        run: python -c "from django.core.management.utils import get_random_secret_key; print(f'SECRET_KEY={get_random_secret_key()}')" >> "$GITHUB_ENV"
      - name: Check Django configuration
        run: python manage.py check
      - name: Run tests
        run: python manage.py test tasks
