# Koyeb App Configuration
name: novembo-todo-api
services:
  - name: novembo-todo-api
    type: web
    git:
      repository: github.com/Novembo/TODO
      branch: main
      build_command: bash build.sh
      run_command: gunicorn Todo.wsgi:application --bind 0.0.0.0:8000
    regions:
      - fra
    instance_type: nano
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
    health_checks:
      - http:
          path: /
          port: 8000
    env:
      - key: DEBUG
        value: "False"
      - key: TYPE_DATABASE
        value: POSTGRES
      - key: DATABASE_ENGINE
        value: django.db.backends.postgresql
      - key: DATABASE_NAME
        value: todo
